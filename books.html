<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libro completo</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }
    #book { white-space: pre-wrap; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Libro desde Project Gutenberg</h1>
  <div id="book">Cargando...</div>

  <script>
    // Obtener el parámetro ?q= de la URL
    const params = new URLSearchParams(window.location.search);
    const query = params.get("q");

    // Catálogo de títulos con IDs reales de Gutenberg
    const catalog = {
      "Dracula": 345,
      "Pride and Prejudice": 1342,
      "Moby Dick": 2701,
      "Alice in Wonderland": 11,
      "Don Quijote": 2000
    };

    if(query) {
      const id = catalog[query];
      if(id) {
        fetch(`https://www.gutenberg.org/files/${id}/${id}-0.txt`)
          .then(res => res.text())
          .then(text => {
            document.getElementById("book").textContent = text;
          })
          .catch(err => {
            document.getElementById("book").textContent = "Error al cargar el libro.";
          });
      } else {
        document.getElementById("book").textContent = "Este título no está en el catálogo configurado.";
      }
    } else {
      document.getElementById("book").textContent = "No se especificó ningún libro.";
    }
  </script>
</body>
</html>
